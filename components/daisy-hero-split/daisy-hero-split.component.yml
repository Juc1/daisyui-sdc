$schema: "https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json"
name: Daisy Hero (Side by Side)
description: "Two-column hero layout with media/figure on one side and content on the other [DaisyUI: Hero with figure & Hero with figure but reverse order]."
group: DaisyUI
status: stable
props:
  type: object
  properties:
    media:
      $ref: json-schema-definitions://canvas.module/image
      title: Media Image
      description: "Image displayed alongside content in the split hero [DaisyUI: Hero with figure]."
      type: object
    media_position:
      type: string
      title: Media Position (Desktop)
      description: "Side on which the media image is displayed on desktop."
      enum:
        - left
        - right
      meta:enum:
        left: "Media Left, Content Right [DaisyUI: Hero with figure]"
        right: "Content Left, Media Right [DaisyUI: Hero with figure but reverse order]"
      default: left
      examples:
        - left
    layout_ratio:
      type: string
      title: Column Ratio (Desktop)
      description: "Width distribution between media and content on desktop screens."
      enum:
        - "1:1"
        - "1:2"
        - "2:1"
      meta:enum:
        "1:1": "Equal width (50% / 50%)"
        "1:2": "Narrow media / Wide content (33% / 67%)"
        "2:1": "Wide media / Narrow content (67% / 33%)"
      default: "1:1"
      examples:
        - "1:1"
    mobile_order:
      type: string
      title: Mobile Stacking Order (< 1024px)
      description: "Controls whether media or text appears first when stacked vertically on mobile screens."
      enum:
        - media-first
        - content-first
      meta:enum:
        media-first: "Media on top, text below"
        content-first: "Text on top, media below"
      default: media-first
      examples:
        - media-first
    media_aspect_ratio:
      type: string
      title: Media Aspect Ratio
      description: "Aspect ratio / crop applied to the media image."
      enum:
        - auto
        - "1:1"
        - "4:3"
        - "3:2"
        - "16:9"
      meta:enum:
        auto: "Natural (no crop)"
        "1:1": "Square (1:1)"
        "4:3": "Standard (4:3)"
        "3:2": "Classic (3:2)"
        "16:9": "Widescreen (16:9)"
      default: auto
      examples:
        - auto
    media_radius:
      type: string
      title: Media Border Radius
      description: "Corner rounding for the media image."
      enum:
        - none
        - small
        - medium
        - large
        - full
      meta:enum:
        none: "Sharp (rounded-none)"
        small: "Small (rounded-sm)"
        medium: "Medium (rounded-2xl)"
        large: "Large (rounded-3xl)"
        full: "Circle / Pill (rounded-full)"
      default: medium
      examples:
        - medium
    background_color:
      type: string
      title: Background Surface
      description: "Background surface color token for the hero banner."
      enum:
        - base-200
        - base-100
        - base-300
        - neutral
        - primary
        - transparent
      meta:enum:
        base-200: "Subtle Surface (Base 200)"
        base-100: "Base Surface (Base 100)"
        base-300: "Muted Surface (Base 300)"
        neutral: "Neutral / Dark"
        primary: "Primary Brand Surface"
        transparent: "Transparent / Inherit"
      default: base-200
      examples:
        - base-200
    min_height:
      type: string
      title: Minimum Height
      description: "Height preset for the hero container."
      enum:
        - screen
        - large
        - medium
        - small
        - auto
      meta:enum:
        screen: "Full Screen (min-h-screen)"
        large: "Large (min-h-[70vh])"
        medium: "Medium (min-h-[50vh])"
        small: "Small (min-h-[35vh])"
        auto: "Auto / Padded (min-h-fit)"
      default: medium
      examples:
        - medium
    data_theme:
      type: string
      title: Theme Override
      description: "Optional DaisyUI theme name applied directly to the hero via data-theme."
      examples:
        - "dark"
        - "light"
    title:
      type: string
      title: Headline Title
      description: "Quick prop for hero title when not using the content slot."
      examples:
        - "Great headline"
    title_level:
      type: integer
      title: Heading Level
      description: "HTML heading level (1-6) for the title prop."
      default: 1
      examples:
        - 1
    text:
      type: string
      title: Body Copy
      description: "Quick prop for hero body copy when not using the content slot."
    cta_text:
      type: string
      title: CTA Button Text
      description: "Quick prop for call-to-action button label."
    cta_url:
      type: string
      title: CTA Button URL
      description: "Destination URL for call-to-action button."
slots:
  content:
    title: Content
    description: "Main content area for headings, text, buttons, and composite blocks."

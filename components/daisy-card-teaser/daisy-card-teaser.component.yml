$schema: "https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json"
name: Daisy Card Teaser
description: "Streamlined, pure-prop teaser card for Views listings, node grids, and article feeds with accessible stretched links and zero slot clutter."
group: DaisyUI
status: stable
props:
  type: object
  properties:
    heading_text:
      type: string
      title: Title
      description: "Card or article title."
      default: "Card Title"
      examples:
        - "Card Title"
    level:
      type: number
      title: Heading Level
      enum:
        - 2
        - 3
        - 4
        - 5
        - 6
      default: 3
      examples:
        - 3
    url:
      type: string
      title: Link URL
      format: uri-reference
      examples:
        - "/blog/my-post"
    media:
      $ref: json-schema-definitions://canvas.module/image
      title: Image Media
      type: object
      examples:
        - src: "https://placehold.co/1200x800"
          alt: "Article thumbnail"
          width: 1200
          height: 800
    caption:
      type: string
      title: Image Caption
      examples:
        - "Photo caption"
    aspect_ratio:
      type: string
      title: Media Aspect Ratio
      enum:
        - auto
        - "16:9"
        - "4:3"
        - "1:1"
        - "3:2"
        - "2:1"
      default: "3:2"
      meta:enum:
        auto: "Natural / Auto"
        "16:9": "16:9 (Widescreen)"
        "4:3": "4:3 (Standard)"
        "1:1": "1:1 (Square)"
        "3:2": "3:2 (Standard Photo)"
        "2:1": "2:1 (Panoramic)"
      examples:
        - "3:2"
    text:
      type: string
      title: Summary / Excerpt
      contentMediaType: text/html
      x-formatting-context: block
      examples:
        - "<p>Engaging summary text for the card content.</p>"
    category:
      type: string
      title: Category / Tag
      description: "Optional top badge or category label (e.g. 'News', 'Category / tag')."
      default: "Category / tag"
      examples:
        - "Category / tag"
    date:
      type: string
      title: Date or Metadata
      description: "Optional metadata text displayed at the bottom (e.g. 'Oct 25, 2026' or '5 min read')."
      examples:
        - "Oct 25, 2026"
    icon:
      type: string
      title: Icon Name
      description: "Optional icon identifier from the icon pack (e.g. 'flower-lotus', 'rocket', 'arrow-up-right', 'star', 'check')."
      default: "flower-lotus"
      examples:
        - "flower-lotus"
    icon_position:
      type: string
      title: Icon Position
      description: "Placement of the icon within the card."
      enum:
        - top-left
        - top-center
        - top-right
        - title-start
        - title-end
        - bottom-right
      default: top-center
      meta:enum:
        top-left: "Top Left (Feature header)"
        top-center: "Top Centered"
        top-right: "Top Right (Corner indicator)"
        title-start: "Before Title"
        title-end: "After Title"
        bottom-right: "Bottom Right (Trailing arrow)"
      examples:
        - top-center
    icon_style:
      type: string
      title: Icon Style
      description: "Visual container style for header/corner icons."
      enum:
        - plain
        - badge
      default: plain
      meta:enum:
        plain: "Plain (Raw icon)"
        badge: "Enclosed Badge (Soft surface box)"
      examples:
        - plain
    icon_pack:
      type: string
      title: Icon Pack
      description: "Icon pack identifier used by Drupal core Icon API."
      default: phosphor
      examples:
        - phosphor
    is_text_centered:
      type: boolean
      title: Center Text
      default: false
      examples:
        - false
    orientation:
      type: string
      title: Orientation
      enum:
        - vertical
        - horizontal
      default: vertical
      meta:enum:
        vertical: "Vertical (Standard)"
        horizontal: "Horizontal (Side-by-side)"
      examples:
        - vertical
    height:
      type: string
      title: Card Height
      enum:
        - auto
        - full
      default: full
      meta:enum:
        auto: "Auto (Fits content)"
        full: "Full (Equal height in grid / section)"
      examples:
        - full
    style:
      type: string
      title: Style Mode
      enum:
        - full
        - framed
        - border
        - dash
      default: full
      meta:enum:
        full: "Full (Default)"
        framed: "Framed (Padded with inset)"
        border: "Bordered (card-border)"
        dash: "Dashed border (card-dash)"
      examples:
        - full
    border_width:
      type: string
      title: Border Width
      description: "Border thickness when using Bordered/Dashed style or setting a custom border."
      enum:
        - default
        - "1"
        - "2"
        - "4"
      default: default
      meta:enum:
        default: "Default (1px)"
        "1": "1px"
        "2": "2px"
        "4": "4px"
      examples:
        - default
    border_color:
      type: string
      title: Border Color
      description: "Border color when using Bordered/Dashed style or setting a custom border."
      enum:
        - default
        - base-200
        - base-300
        - primary
        - secondary
        - accent
        - neutral
        - info
        - success
        - warning
        - error
      default: default
      meta:enum:
        default: "Default (Base 200)"
        base-200: "Base 200"
        base-300: "Base 300"
        primary: "Primary"
        secondary: "Secondary"
        accent: "Accent"
        neutral: "Neutral"
        info: "Info"
        success: "Success"
        warning: "Warning"
        error: "Error"
      examples:
        - default
    size:
      type: string
      title: Size
      enum:
        - sm
        - md
        - lg
        - xl
      default: md
      meta:enum:
        sm: Small
        md: Medium (Default)
        lg: Large
        xl: Extra Large
      examples:
        - md
    background:
      type: string
      title: Background Surface
      enum:
        - default
        - base-200
        - base-300
        - primary
        - secondary
        - accent
        - neutral
        - transparent
      default: default
      meta:enum:
        default: "Default (Base 100)"
        base-200: "Base 200"
        base-300: "Base 300"
        primary: "Primary"
        secondary: "Secondary"
        accent: "Accent"
        neutral: "Neutral"
        transparent: "Transparent"
      examples:
        - default
    shadow:
      type: string
      title: Shadow Elevation
      enum:
        - none
        - sm
        - md
        - lg
        - xl
        - 2xl
      default: xl
      meta:enum:
        none: None
        sm: Small
        md: Medium
        lg: Large
        xl: Extra Large
        2xl: 2X Large
      examples:
        - xl
    border_top:
      type: boolean
      title: 10px Top Border Accent
      description: "Applies a prominent 10px top accent border to the card header edge."
      default: false
      examples:
        - false
    border_top_color:
      type: string
      title: Top Border Color
      description: "Color token for the 10px top border accent."
      enum:
        - primary
        - secondary
        - accent
        - neutral
        - base-300
      default: primary
      meta:enum:
        primary: Primary
        secondary: Secondary
        accent: Accent
        neutral: Neutral
        base-300: Base 300
      examples:
        - primary
    card_classes:
      type: string
      title: Additional Classes
      description: "Additional CSS utility classes."

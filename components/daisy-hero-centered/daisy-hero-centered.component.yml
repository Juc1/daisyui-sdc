$schema: "https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json"
name: Daisy Hero (Centered / Banner)
description: "Centered hero banner supporting optional background images with dark overlays, surface colors, and slot-based composition [DaisyUI: Centered hero & Hero with overlay image]."
group: DaisyUI
status: stable
props:
  type: object
  properties:
    background_media:
      $ref: json-schema-definitions://canvas.module/image
      title: Background Image
      description: "Full-bleed background image covering the entire hero banner [DaisyUI: Hero with overlay image]."
      type: object
    overlay_opacity:
      type: string
      title: Background Overlay Opacity
      description: "Darkening overlay applied over background images to maintain text contrast [DaisyUI: Hero with overlay image]."
      enum:
        - none
        - "20"
        - "40"
        - "50"
        - "60"
        - "80"
      meta:enum:
        none: "None (0%)"
        "20": "Light (20%)"
        "40": "Subtle (40%)"
        "50": "Medium (50%)"
        "60": "Dark (60%)"
        "80": "Heavy (80%)"
      default: none
      examples:
        - none
    background_color:
      type: string
      title: Background Surface
      description: "Background surface color token when no background image is set."
      enum:
        - base-200
        - base-100
        - base-300
        - neutral
        - primary
        - transparent
      meta:enum:
        base-200: "Subtle Surface (Base 200)"
        base-100: "Base Surface (Base 100)"
        base-300: "Muted Surface (Base 300)"
        neutral: "Neutral / Dark"
        primary: "Primary Brand Surface"
        transparent: "Transparent / Inherit"
      default: base-200
      examples:
        - base-200
    min_height:
      type: string
      title: Minimum Height
      description: "Height preset for the hero container."
      enum:
        - screen
        - large
        - medium
        - small
        - auto
      meta:enum:
        screen: "Full Screen (min-h-screen)"
        large: "Large (min-h-[70vh])"
        medium: "Medium (min-h-[50vh])"
        small: "Small (min-h-[35vh])"
        auto: "Auto / Padded (min-h-fit)"
      default: medium
      examples:
        - medium
    content_max_width:
      type: string
      title: Content Max Width
      description: "Max width constraint for hero text column."
      enum:
        - sm
        - md
        - lg
        - xl
        - 2xl
        - full
      meta:enum:
        sm: "Small (max-w-md)"
        md: "Medium (max-w-xl)"
        lg: "Large (max-w-2xl)"
        xl: "Extra Large (max-w-4xl)"
        2xl: "Wide (max-w-6xl)"
        full: "Full Width"
      default: lg
      examples:
        - lg
    text_align:
      type: string
      title: Text Alignment
      description: "Horizontal alignment of the content."
      enum:
        - center
        - left
      meta:enum:
        center: "Centered Content [DaisyUI: Centered hero]"
        left: "Left Aligned Content"
      default: center
      examples:
        - center
    data_theme:
      type: string
      title: Theme Override
      description: "Optional DaisyUI theme name applied directly to the hero via data-theme."
      examples:
        - "dark"
        - "light"
    title:
      type: string
      title: Headline Title
      description: "Quick prop for hero title when not using the content slot."
      examples:
        - "Hello there"
    title_level:
      type: integer
      title: Heading Level
      description: "HTML heading level (1-6) for the title prop."
      default: 1
      examples:
        - 1
    text:
      type: string
      title: Body Copy
      description: "Quick prop for hero body copy when not using the content slot."
      contentMediaType: text/html
      x-formatting-context: block
      examples:
        - "<p>Engaging subtitle or promotional paragraph.</p>"
    cta_text:
      type: string
      title: CTA Button Text
      description: "Quick prop for call-to-action button label."
    cta_url:
      type: string
      title: CTA Button URL
      description: "Destination URL for call-to-action button."
slots:
  content:
    title: Content
    description: "Main content area for headings, text, buttons, and composite blocks."
